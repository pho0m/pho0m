    <!--
      Every font the first screen uses (Latin + Thai, about 95 kB in all), fetched with the
      HTML. The static snapshot is hidden while the app loads, so without these the fonts
      would only be found when React renders, swap in late and reflow the hero (CLS).
      Vite resolves each path to the same hashed file the @fontsource CSS uses. (The dev
      server cannot serve these paths, so `npm run dev` logs "preloaded but not used".)
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-500-normal.woff2" />

    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-600-normal.woff2" />
