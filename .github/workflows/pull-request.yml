# Pull requests.
#   check    typecheck, test, build the site and the API bundle. Runs for every pull request,
#            forks included: it uses no secrets and only a read-only token.
# Previews: Cloudflare Workers Builds can build every non-production branch and post a preview
# URL (Cloudflare dashboard → pho0m → Settings → Build → Branch control). No secrets needed here.
# Setup guide: docs/SETUP.md

name: Pull request

on: pull_request

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build API bundle
        run: npm run build:api

      # Built-in content (content/seed.json): the same code path as production, without secrets.
      - name: Build site
        run: npm run build
