# Pull requests.
#   check    typecheck, test, build the site and the API bundle. Runs for every pull request,
#            forks included: it uses no secrets and only a read-only token.
#   preview  deploy the site to a Firebase Hosting preview channel (the action comments the
#            preview URL on the PR). Only for branches of this repository, because forks have
#            no access to the secrets.
# Setup guide: docs/SETUP.md

name: Pull request

on: pull_request

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build API bundle
        run: npm run build:api

      # Built-in content (content/seed.json): the same code path as production, without secrets.
      - name: Build site
        run: npm run build

  preview:
    name: Deploy preview
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Same content source as production, so the preview shows the live content.
      # The admin page on a preview URL is not in the API's ALLOWED_ORIGINS, so its calls are blocked.
      - name: Build site
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          BUCKET: ${{ secrets.SERVICE_ACCOUNT_BUCKET_NAME }}
        run: |
          VITE_CONTENT_URL=""
          if [ -n "$BUCKET" ]; then
            VITE_CONTENT_URL="https://storage.googleapis.com/${BUCKET}/content/site.json"
          fi
          export VITE_CONTENT_URL
          npm run build

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIATTIPHOOM_PHO0M }}
          projectId: kiattiphoom-pho0m
          expires: 7d
