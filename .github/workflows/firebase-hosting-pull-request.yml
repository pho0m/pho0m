# Pull requests from branches of this repository: check, build and deploy a Firebase Hosting
# preview channel (the action comments the preview URL on the PR). Forks have no access to
# the secrets, so they are skipped. Setup guide: docs/SETUP.md

name: Preview (pull request)

on: pull_request

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_preview:
    name: Check and deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build API bundle
        run: npm run build:api

      # Same content source as production, so the preview shows the live content.
      # The admin page on a preview URL is not in the API's ALLOWED_ORIGINS, so its calls are blocked.
      - name: Build site
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          BUCKET: ${{ secrets.SERVICE_ACCOUNT_BUCKET_NAME }}
        run: |
          VITE_CONTENT_URL=""
          if [ -n "$BUCKET" ]; then
            VITE_CONTENT_URL="https://storage.googleapis.com/${BUCKET}/content/site.json"
          fi
          export VITE_CONTENT_URL
          npm run build

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIATTIPHOOM_PHO0M }}
          projectId: kiattiphoom-pho0m
          expires: 7d
